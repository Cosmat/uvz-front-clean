# Keep API Warm - pings Render API every 10 minutes to prevent free-tier spin-down
# (Render Free sleeps after 15 min idle; first visitor then waits ~50s)
name: Keep API Warm

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping API health (wake up)
        run: |
          echo "Pinging API at $(date -u +%H:%M:%S) UTC"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://uvz-api.onrender.com/api/health)
          echo "Health status: $code"
          # Warm up the data endpoints too (Mongo connection + query cache)
          code2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "https://uvz-api.onrender.com/api/zayavki?limit=1")
          echo "Zayavki status: $code2"
          if [ "$code" != "200" ] && [ "$code2" != "200" ]; then
            echo "::warning::API did not respond with 200"
          fi
